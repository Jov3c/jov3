services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - ${JOV3_DATA_ROOT:-/srv/jov3/data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      MEDIA_STORAGE_ROOT: /srv/jov3/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${JOV3_DATA_ROOT:-/srv/jov3/data}/uploads:/srv/jov3/data/uploads
      - ${JOV3_DATA_ROOT:-/srv/jov3/data}/geo:/srv/jov3/data/geo
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${JOV3_TLS_ROOT:-/srv/jov3/tls}:/etc/nginx/certs:ro
